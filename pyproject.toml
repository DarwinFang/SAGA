[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saga-text-aggregation"
version = "1.0.0"
description = "Semantic alignment guided text answer aggregation"
requires-python = ">=3.11"
dependencies = ["numpy==2.4.4", "scipy==1.17.1", "nltk==3.9.2"]

[project.scripts]
saga-experiments = "saga.experiments:main"

[project.optional-dependencies]
plots = ["matplotlib>=3.9,<4"]
embedding = ["torch>=2.4", "transformers>=4.51,<5"]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"src/saga/experiments.py" = ["E402"]
